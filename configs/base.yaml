project:
  name: online-shoppers-nn2026

data:
  dataset: Online Shoppers Purchasing Intention
  target: Revenue
  raw_file: data/raw/online_shoppers.csv
  processed_dir: data/processed

preprocessing:
  remove_duplicates: true
  drop_rows_missing_target: true
  numerical_scaling: StandardScaler
  categorical_encoding: OneHotEncoder

split:
  train_size: 0.70
  validation_size: 0.15
  test_size: 0.15
  random_state: 42
  stratify: true
